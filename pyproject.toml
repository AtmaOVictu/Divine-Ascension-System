[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "divine-ascension-system"
version = "0.1.0"
description = "Dynamic agent-based system based on ontological framework"
authors = [{name = "Luka Pintarič", email = "lukapin5@gmail.com"}]
requires-python = ">=3.8"
readme = "README.md"
keywords = ["agents", "ontology", "philosophy", "dynamic systems", "agent-based systems", "magnetic dynamics"]
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.4",
    "scipy>=1.7",
    "pandas>=1.3"
]

[project.urls]
Homepage = "https://example.com"
Documentation = "https://example.com/docs"
Source = "https://github.com/username/divine-ascension-system"

[tool.setuptools]
packages = ["divine_agents"]
include-package-data = true

[tool.setuptools.package_data]
"divine_agents" = ["data/*.json", "data/*.yaml"]
