[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "divine-agents"
version = "0.1.0"
description = "Dynamic ontological agent system"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["divine_agents"]
