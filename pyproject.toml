[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "divine-ascension-system"
version = "0.1.0"
description = "Dynamic agent-based system for philosophical dialogues"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["divine_agents*"]
