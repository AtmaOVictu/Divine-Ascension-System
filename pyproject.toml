[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "divine-ascension-system"
version = "0.1.0"
description = "Dynamic agent-based system for philosophical debates"
authors = [{name = "Unknown", email = "author@example.com"}]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://example.com"
